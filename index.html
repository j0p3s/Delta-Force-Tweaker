<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delta Force Tweaker</title>
<meta name="description" content="Pick your hardware and get tuned Delta Force graphics settings, a ready-to-use UserSystemSettingHD.ini and an NVIDIA Profile Inspector profile. Runs 100% in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 6 58h52z' fill='none' stroke='%2322c55e' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M32 24 20 50h24z' fill='%2322c55e'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f5;--surface:#ffffff;--surface2:#eef2f0;--text:#14201a;--muted:#5b6b62;--border:#d5ddd8;
  --accent:#118a43;--accent-text:#ffffff;--warn-bg:#fff6e0;--warn-border:#e7b54a;--warn-text:#5c4100;
  --ok:#118a43;--add:#1d6fd1;--danger:#b42318;--code:#e7ece9;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1210;--surface:#141b17;--surface2:#1a231e;--text:#e3ebe6;--muted:#93a39a;--border:#26332c;
    --accent:#22c55e;--accent-text:#04110a;--warn-bg:#2a2210;--warn-border:#7a5c16;--warn-text:#f2d9a0;
    --ok:#22c55e;--add:#5aa2f5;--danger:#f97066;--code:#1f2a24;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1210;--surface:#141b17;--surface2:#1a231e;--text:#e3ebe6;--muted:#93a39a;--border:#26332c;
  --accent:#22c55e;--accent-text:#04110a;--warn-bg:#2a2210;--warn-border:#7a5c16;--warn-text:#f2d9a0;
  --ok:#22c55e;--add:#5aa2f5;--danger:#f97066;--code:#1f2a24;--shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--accent)}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.88em;background:var(--code);padding:.1em .35em;border-radius:5px;word-break:break-all}
kbd{border:1px solid var(--border)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--border);background:var(--surface)}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem}
.brand svg{width:28px;height:28px}
.ver{font-size:.75rem;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:1px 8px}
.tools{display:flex;gap:8px;align-items:center}
select,input[type=file]{font:inherit;color:var(--text)}
select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;min-height:42px}
.tools select{width:auto;min-height:36px;padding:6px 8px}
.hero{padding:28px 0 8px}
.hero h1{margin:0 0 6px;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.2}
.hero p{margin:0;color:var(--muted);max-width:720px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge{font-size:.8rem;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:3px 10px;color:var(--muted)}
section.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin:18px 0}
.card h2{margin:0 0 4px;font-size:1.2rem;display:flex;align-items:center;gap:10px}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-text);font-size:.9rem;flex:none}
.sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:600}
.btn{font:inherit;font-weight:600;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 0}
.note{font-size:.88rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.seg label{border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.seg input{margin-top:4px;accent-color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--surface2)}
.seg b{display:block}
.seg span{font-size:.85rem;color:var(--muted)}
.switch{display:flex;gap:10px;align-items:flex-start;margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface)}
.switch input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.switch:has(input:checked){border-color:var(--accent);background:var(--surface2)}
.switch b{display:block}
.switch span{font-size:.85rem;color:var(--muted)}
.tier{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.tier strong{color:var(--accent);font-size:1.1rem}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.tbl td:last-child{font-weight:600}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.warn{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);border-radius:10px;padding:12px 14px;font-size:.92rem}
.warn b{display:block;margin-bottom:4px}
ol.steps{padding-left:1.3em;margin:12px 0}
ol.steps li{margin:6px 0}
.drop{display:block;border:2px dashed var(--border);border-radius:12px;padding:22px;text-align:center;background:var(--surface2);cursor:pointer}
.drop.over{border-color:var(--accent)}
.drop input{display:none}
.status{margin-top:10px;font-weight:600}
.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
.tag{font-size:.75rem;font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap}
.tag.chg{background:var(--accent);color:var(--accent-text)}
.tag.add{background:var(--add);color:#fff}
.tag.same{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.muted{color:var(--muted)}
.hidden{display:none!important}
ul.tips{margin:8px 0 0;padding-left:1.2em}
ul.tips li{margin:6px 0}
footer{color:var(--muted);font-size:.85rem;padding:24px 0 40px;border-top:1px solid var(--border);margin-top:28px}
footer p{margin:6px 0}
@media (max-width:560px){
  .seg{grid-template-columns:1fr}
  section.card{padding:16px}
  .tbl th:nth-child(3),.tbl td:nth-child(3){display:none}
}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 6 58h52z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" style="color:var(--accent)"/><path d="M32 24 20 50h24z" fill="currentColor" style="color:var(--accent)"/></svg>
      <span>Delta Force Tweaker</span><span class="ver" id="ver"></span>
    </div>
    <div class="tools">
      <select id="lang" aria-label="Language"></select>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1 data-i="heroTitle"></h1>
    <p data-i="heroText"></p>
    <div class="badges"><span class="badge" data-i="badge1"></span><span class="badge" data-i="badge2"></span><span class="badge" data-i="badge3"></span></div>
  </div>

  <!-- 1. Hardware -->
  <section class="card" id="s1">
    <h2><span class="num">1</span><span data-i="s1Title"></span></h2>
    <p class="sub" data-i="s1Sub"></p>
    <div class="grid">
      <label class="f"><span data-i="gpuVendor"></span><select id="vendor"></select></label>
      <label class="f"><span data-i="gpuSeries"></span><select id="series"></select></label>
      <label class="f"><span data-i="vram"></span><select id="vram"></select></label>
      <label class="f"><span data-i="ram"></span><select id="ram"></select></label>
      <label class="f"><span data-i="threads"></span><select id="threads"></select></label>
      <label class="f"><span data-i="resolution"></span><select id="res"></select></label>
      <label class="f"><span data-i="refresh"></span><select id="hz"></select></label>
    </div>
    <div class="row">
      <button class="btn" id="detect" type="button"><span data-i="detectBtn"></span></button>
      <span class="note" id="detectMsg" data-i="detectNote"></span>
    </div>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="profile" value="Balanced" checked><div><b data-i="profBalanced"></b><span data-i="profBalancedDesc"></span></div></label>
      <label><input type="radio" name="profile" value="Competitive"><div><b data-i="profCompetitive"></b><span data-i="profCompetitiveDesc"></span></div></label>
    </div>
    <label class="switch"><input type="checkbox" id="potato"><div><b data-i="potatoLabel"></b><span data-i="potatoDesc"></span></div></label>
    <div class="tier"><span data-i="tierLabel"></span> <strong id="tierName"></strong> <span class="muted" id="tierReason"></span></div>
  </section>

  <!-- 2. Recommended settings -->
  <section class="card" id="s2">
    <h2><span class="num">2</span><span data-i="s2Title"></span></h2>
    <p class="sub" data-i="s2Sub"></p>
    <div class="tbl-wrap"><table class="tbl" id="recTable"><thead><tr><th data-i="colSetting"></th><th data-i="colValue"></th></tr></thead><tbody></tbody></table></div>
    <p class="note" data-i="manualNote"></p>
  </section>

  <!-- 3. INI -->
  <section class="card" id="s3">
    <h2><span class="num">3</span><span data-i="s3Title"></span></h2>
    <p class="sub" data-i="s3Sub"></p>
    <div class="warn"><b data-i="warnTitle"></b><span data-i="warnText"></span></div>
    <ol class="steps" id="iniSteps"></ol>
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".ini">
      <div><strong data-i="uploadLabel"></strong></div>
      <div class="note" data-i="uploadHint"></div>
    </label>
    <div class="status" id="fileStatus"></div>
    <div id="iniResult" class="hidden">
      <div class="tbl-wrap"><table class="tbl" id="chgTable"><thead><tr><th data-i="colSetting"></th><th data-i="colBefore"></th><th data-i="colKey"></th><th data-i="colAfter"></th></tr></thead><tbody></tbody></table></div>
      <p class="note" id="dlssNote"></p>
      <div class="row">
        <button class="btn primary" id="dlIni" type="button"><span data-i="downloadIni"></span></button>
        <button class="btn" id="dlOrig" type="button"><span data-i="downloadOrig"></span></button>
      </div>
      <ol class="steps" id="afterSteps"></ol>
    </div>
  </section>

  <!-- 4. NVIDIA -->
  <section class="card" id="s4">
    <h2><span class="num">4</span><span data-i="s4Title"></span></h2>
    <p class="sub" data-i="s4Sub"></p>
    <div id="nvBlock">
      <div class="tbl-wrap"><table class="tbl" id="nvTable"><thead><tr><th data-i="colSetting"></th><th data-i="colValue"></th></tr></thead><tbody></tbody></table></div>
      <div class="row"><button class="btn primary" id="dlNip" type="button"><span data-i="downloadNip"></span></button></div>
      <ol class="steps" id="nvSteps"></ol>
      <p class="note" data-i="nvKeep"></p>
    </div>
    <p class="warn hidden" id="nvNo" data-i="nvNotNvidia"></p>
  </section>

  <!-- 5. Extras -->
  <section class="card" id="s5">
    <h2><span class="num">5</span><span data-i="s5Title"></span></h2>
    <ul class="tips" id="tips"></ul>
  </section>
</main>

<footer>
  <div class="wrap">
    <p data-i="footPrivacy"></p>
    <p data-i="footScript"></p>
    <p data-i="footCredits"></p>
    <p data-i="footDisclaimer"></p>
  </div>
</footer>

<script>
/* ====================================================================
   Delta Force Tweaker - web version
   Version is shared with the .cmd script and CHANGELOG.md.
   ==================================================================== */
const VERSION = '1.1.0-beta';
const REPO_URL = 'https://github.com/j0p3s/Delta-Force-Tweaker';
const NPI_URL  = 'https://github.com/j0p3s/nvidiaProfileInspector';
const NPI_UPSTREAM = 'https://github.com/Orbmu2k/nvidiaProfileInspector';
</script>

<script id="core">
/* ---------------- Core logic (no DOM) ----------------
   Value scales confirmed against the in-game menu (game version 1.102.37117):
   Quality:  0 Low | 1 Medium | 2 High | 3 Ultra | 4 Extreme | 5 Ultimate
   AO:       0 Off | 1 Medium | 2 High | 3 Ultra | 4 Extreme | 5 Ultimate
   DLSS:     0 Auto | 1 Ultra Performance | 2 Performance | 3 Balanced | 4 Quality
   FPS cap:  0 Unlimited | 1 30 | 2 60 | 3 75 | 4 100 | 5 120 | 6 144
   Reflex:   0 Off | 1 Low Latency | 2 Enhanced
   GraphicsPreset 0 = Custom. SuperResolutionMethod is not positional (DLSS = 4) and is never changed.
   The game omits keys that are at their default value, so missing keys are added. */
const Core = (() => {
  const QN = ['Low', 'Medium', 'High', 'Ultra', 'Extreme', 'Ultimate'];
  const AON = ['Off', 'Medium', 'High', 'Ultra', 'Extreme', 'Ultimate'];
  const DLSSN = ['Auto', 'Ultra Performance', 'Performance', 'Balanced', 'Quality'];
  const RFXN = ['Off', 'Low Latency', 'Enhanced'];
  const FPS = { 30: 1, 60: 2, 75: 3, 100: 4, 120: 5, 144: 6 };
  const SECTION = '[/Script/GPGlobalDefines.ClientVideoSettingHD]';

  // GPU series: cap = highest tier allowed, kind = upscaler/feature family
  const SERIES = {
    nvidia: [
      ['rtx50', 'GeForce RTX 50', 3, 'rtx'], ['rtx40', 'GeForce RTX 40', 3, 'rtx'], ['rtx30', 'GeForce RTX 30', 3, 'rtx'],
      ['rtx20', 'GeForce RTX 20', 3, 'rtx'], ['gtx16', 'GeForce GTX 16', 1, 'gtx'], ['gtx10hi', 'GeForce GTX 1070 / 1080', 2, 'gtx'],
      ['gtx10lo', 'GeForce GTX 1050 / 1060', 1, 'gtx'], ['gtx9', 'GeForce GTX 900', 1, 'gtx']
    ],
    amd: [
      ['rx9000', 'Radeon RX 9000', 3, 'amd'], ['rx7000', 'Radeon RX 7000', 3, 'amd'], ['rx6000', 'Radeon RX 6000', 3, 'amd'],
      ['rx5000', 'Radeon RX 5600 / 5700', 2, 'amd'], ['rx500', 'Radeon RX 400 / 500', 1, 'amd'], ['vega', 'Radeon Vega 56 / 64', 2, 'amd']
    ],
    intel: [['arcB', 'Intel Arc B-series', 3, 'arc'], ['arcA', 'Intel Arc A-series', 3, 'arc']],
    igpu: [['igpuIntel', 'Intel UHD / Iris Xe', 0, 'igpu'], ['igpuAmd', 'AMD Radeon Graphics (APU)', 0, 'igpu']]
  };

  function findSeries(id) {
    for (const v of Object.keys(SERIES)) for (const s of SERIES[v]) if (s[0] === id) return { vendor: v, id: s[0], name: s[1], cap: s[2], kind: s[3] };
    return null;
  }

  // Same tier rules as the .cmd script
  function computeTier(hw) {
    const s = findSeries(hw.series) || { cap: 3, kind: 'rtx' };
    let tier, reason = 'vram';
    if (hw.vram < 4) tier = 0; else if (hw.vram < 6) tier = 1; else if (hw.vram < 10) tier = 2; else tier = 3;
    if (s.kind === 'igpu') { tier = 0; reason = 'integrated'; }
    if (tier > s.cap) { tier = s.cap; reason = 'older'; }
    if (hw.ram < 12 || hw.threads < 6) { if (tier > 1) { tier = 1; reason = 'ramcpu'; } }
    else if (hw.ram < 16 || hw.threads < 8) { if (tier > 2) { tier = 2; reason = 'ramcpu'; } }
    let tex;
    if (hw.vram < 4) tex = 0; else if (hw.vram < 6) tex = 1; else if (hw.vram < 8) tex = 2; else tex = 3;
    if (s.kind === 'igpu') tex = 0;
    return { tier, reason, tex, kind: s.kind };
  }

  function fpsIndex(target) {
    if (target <= 0) return { idx: 0, txt: 'Unlimited' };
    if (FPS[target] !== undefined) return { idx: FPS[target], txt: String(target) };
    if (target > 144) return { idx: 0, txt: 'Unlimited', note: 'noHz' };
    const keys = Object.keys(FPS).map(Number).filter(k => k <= target).sort((a, b) => b - a);
    const best = keys.length ? keys[0] : 30;
    return { idx: FPS[best], txt: String(best) };
  }

  function upscaler(kind) {
    return { rtx: 'Nvidia DLSS', gtx: 'FSR - Quality', amd: 'FSR - Quality', arc: 'XeSS - Quality', igpu: 'FSR - Balanced' }[kind] || 'FSR - Quality';
  }

  // Ordered list of [iniKey, menuName, value, scale, text?]
  // potato = "Potato shadows" switch: Shadows and Shadow Map at Low (the lowest value the menu
  // allows) in any profile. Values below Low are not used: the game menu does not offer them.
  function profile(hw, mode, potato) {
    const r = computeTier(hw);
    const t = Math.min(r.tier, 3), c = mode === 'Competitive', po = !!potato;
    const min = Math.min, max = Math.max;
    const p = [
      ['TextureQuality', 'Textures', r.tex, 'Q'],
      ['GraphicsPreset', 'Graphics Preset', 0, 'PRE'],
      ['ShadowQuality', 'Shadows', (c || po) ? 0 : min(t, 2), 'Q'],
      ['ViewDistanceLevel', 'Scene View Distance', c ? max(min(t, 2), 1) : t, 'Q'],
      ['TextureFilteringQuality', 'Texture Filtering', min(max(t, 2), 3), 'Q'],
      ['StreamingQuality', 'Streaming', c ? min(t, 1) : min(t, 2), 'Q'],
      ['SceneDetailLevel', 'Scene Details', c ? 0 : t, 'Q'],
      ['ShadingQuality', 'Shaders', c ? 0 : min(t, 2), 'Q'],
      ['ShadowMapResolution', 'Shadow Map', (c || po) ? 0 : min(t, 2), 'Q'],
      ['GIQuality', 'Lumen (GI)', (!c && t >= 3) ? 3 : 0, 'Q'],
      ['ReflectionQuality', 'Reflections', c ? 0 : max(t - 1, 0), 'Q'],
      ['AmbientOcclusionQuality', 'Ambient Occlusion', (!c && t >= 2) ? 2 : 0, 'AO'],
      ['ParticleQuality', 'Particles', c ? 0 : min(t, 2), 'Q'],
      ['DistortionQuality', 'Distortion', c ? 0 : min(t, 2), 'Q'],
      ['PostProcessQuality', 'Post-Processing', c ? 0 : min(t, 2), 'Q'],
      ['VolumetricFogQuality', 'Volumetric Fog', c ? 0 : min(t, 2), 'Q'],
      ['AnimationQuality', 'Animation', c ? 0 : min(t, 2), 'Q']
    ];
    if (r.kind === 'rtx') p.push(['SuperResolutionQualityDLSS', 'Super Resolution (DLSS)', c ? 3 : 4, 'DLSS']);
    if (r.kind === 'rtx' || r.kind === 'gtx') p.push(['NVIDIAReflexMode', 'NVIDIA REFLEX Low Latency', c ? 2 : 1, 'RFX']);
    const f = fpsIndex(c ? 0 : hw.hz);
    p.push(['MaxFPS', 'In-Match Frame Rate Cap', f.idx, 'FPS', f.txt, f.note]);
    return { items: p, tier: r };
  }

  function valueName(e) {
    switch (e[3]) {
      case 'Q': return QN[e[2]];
      case 'AO': return AON[e[2]];
      case 'DLSS': return DLSSN[e[2]];
      case 'RFX': return RFXN[e[2]];
      case 'FPS': return e[4];
      case 'PRE': return 'Custom';
    }
    return String(e[2]);
  }

  // ---- INI encoding helpers ----
  function decode(buf) {
    const b = new Uint8Array(buf);
    if (b.length >= 2 && b[0] === 0xFF && b[1] === 0xFE) return { enc: 'utf16le', text: new TextDecoder('utf-16le').decode(b.subarray(2)) };
    if (b.length >= 3 && b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) return { enc: 'utf8bom', text: new TextDecoder('utf-8').decode(b.subarray(3)) };
    return { enc: 'utf8', text: new TextDecoder('utf-8').decode(b) };
  }
  function encode(text, enc) {
    if (enc === 'utf16le') {
      const out = new Uint8Array(2 + text.length * 2);
      out[0] = 0xFF; out[1] = 0xFE;
      for (let i = 0; i < text.length; i++) { const c = text.charCodeAt(i); out[2 + i * 2] = c & 0xFF; out[3 + i * 2] = c >> 8; }
      return out;
    }
    const u = new TextEncoder().encode(text);
    if (enc === 'utf8bom') { const out = new Uint8Array(u.length + 3); out.set([0xEF, 0xBB, 0xBF]); out.set(u, 3); return out; }
    return u;
  }

  // Applies a profile to UserSystemSettingHD.ini text. Returns { ok, text, changes, dlssSkipped }
  function applyIni(text, items) {
    const lines = text.split(/\r?\n/);
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    let start = -1, end = lines.length;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].trim() === SECTION) { start = i; continue; }
      if (start >= 0 && /^\[/.test(lines[i].trim())) { end = i; break; }
    }
    if (start < 0) return { ok: false };
    let method = '';
    for (let i = start + 1; i < end; i++) { const m = lines[i].match(/^SuperResolutionMethod=(.*)$/); if (m) { method = m[1].trim(); break; } }
    const changes = []; let dlssSkipped = false;
    for (const e of items) {
      const key = e[0], val = String(e[2]);
      if (key === 'SuperResolutionQualityDLSS' && method !== '4') { dlssSkipped = true; continue; }
      let done = false;
      for (let i = start + 1; i < end; i++) {
        const m = lines[i].match(new RegExp('^' + key + '=(.*)$'));
        if (m) {
          const old = m[1];
          lines[i] = key + '=' + val;
          changes.push({ e, key, old, status: old === val ? 'same' : 'chg' });
          done = true; break;
        }
      }
      if (!done) {
        let ins = end;
        while (ins > start + 1 && lines[ins - 1].trim() === '') ins--;
        lines.splice(ins, 0, key + '=' + val);
        end++;
        changes.push({ e, key, old: null, status: 'add' });
      }
    }
    return { ok: true, text: lines.join('\r\n') + '\r\n', changes, dlssSkipped };
  }

  // ---- NVIDIA Profile Inspector .nip ----
  // NVAPI setting IDs verified against the Profile Inspector source code
  const NV_SETTINGS = [
    ['Power management mode', 0x1057EB71, 1, 'nvPower'],
    ['Texture filtering - Quality', 0x00CE2691, 20, 'nvTexQ'],
    ['Texture filtering - Anisotropic sample optimization', 0x00E73211, 1, 'nvAniso'],
    ['Texture filtering - Negative LOD bias', 0x0019BB68, 0, 'nvLod'],
    ['Maximum pre-rendered frames', 0x007BA09E, 1, 'nvPre'],
    ['Threaded optimization', 0x20C1221E, 1, 'nvThread'],
    ['Enable FXAA', 0x1074C972, 0, 'nvFxaa']
  ];
  // Executables NVIDIA's official "Delta Force" profile uses (driver 621.01)
  const NV_EXES = ['deltaforce.exe', 'bhdclient-win64-shipping.exe', 'deltaforce-win64-shipping.exe', 'deltaforceclient-win64-shipping.exe'];

  function buildNip() {
    const x = [];
    x.push('<?xml version="1.0" encoding="utf-8"?>', '<ArrayOfProfile>', '  <Profile>', '    <ProfileName>Delta Force</ProfileName>', '    <Executeables>');
    for (const e of NV_EXES) x.push('      <string>' + e + '</string>');
    x.push('    </Executeables>', '    <Settings>');
    for (const s of NV_SETTINGS) {
      x.push('      <ProfileSetting>', '        <SettingNameInfo>' + s[0] + '</SettingNameInfo>',
        '        <SettingID>' + (s[1] >>> 0) + '</SettingID>', '        <SettingValue>' + (s[2] >>> 0) + '</SettingValue>',
        '        <ValueType>Dword</ValueType>', '      </ProfileSetting>');
    }
    x.push('    </Settings>', '  </Profile>', '</ArrayOfProfile>');
    return x.join('\r\n') + '\r\n';
  }

  // ---- WebGL renderer string -> vendor/series ----
  function parseRenderer(r) {
    if (!r) return null;
    const s = r.replace(/\(R\)|\(TM\)/gi, '');
    let m;
    if ((m = s.match(/RTX\s*(\d)0\d0/i)) || (m = s.match(/RTX\s*(\d)\d{2}/i))) {
      const g = { '5': 'rtx50', '4': 'rtx40', '3': 'rtx30', '2': 'rtx20' }[m[1]];
      if (g) return { vendor: 'nvidia', series: g };
    }
    if ((m = s.match(/GTX\s*16\d{2}/i))) return { vendor: 'nvidia', series: 'gtx16' };
    if ((m = s.match(/GTX\s*10([5-8])0/i))) return { vendor: 'nvidia', series: (m[1] >= '7') ? 'gtx10hi' : 'gtx10lo' };
    if ((m = s.match(/GTX\s*9\d{2}/i))) return { vendor: 'nvidia', series: 'gtx9' };
    if ((m = s.match(/RX\s*(\d)(\d)\d{2}/i))) {
      const g = { '9': 'rx9000', '7': 'rx7000', '6': 'rx6000', '5': 'rx5000' }[m[1]];
      if (g) return { vendor: 'amd', series: g };
    }
    if (/RX\s*[45]\d{2}\b/i.test(s)) return { vendor: 'amd', series: 'rx500' };
    if (/Vega\s*(56|64)/i.test(s)) return { vendor: 'amd', series: 'vega' };
    if (/Arc.*\bB\d{3}/i.test(s)) return { vendor: 'intel', series: 'arcB' };
    if (/Arc/i.test(s)) return { vendor: 'intel', series: 'arcA' };
    if (/Intel.*(UHD|Iris|HD Graphics)/i.test(s)) return { vendor: 'igpu', series: 'igpuIntel' };
    if (/Radeon.*Graphics/i.test(s) && !/RX/i.test(s)) return { vendor: 'igpu', series: 'igpuAmd' };
    return null;
  }

  return { QN, SERIES, findSeries, computeTier, fpsIndex, upscaler, profile, valueName, decode, encode, applyIni, buildNip, NV_SETTINGS, NV_EXES, parseRenderer };
})();

    nvNotNvidia: 'Вы выбрали видеокарту не NVIDIA, поэтому этот шаг не нужен.',

    ],

    footScript: 'Хотите автоматизировать? В <a href="{repo}">репозитории GitHub</a> есть и скрипт для Windows с открытым кодом, который сделает всё это за вас.',
    footCredits: 'NVIDIA Profile Inspector от Orbmu2k (<a href="{up}" target="_blank" rel="noopener">оригинальный проект</a>).',
    footDisclaimer: 'Не связано с Team Jade, TiMi Studio Group, Tencent или NVIDIA. Delta Force — торговая марка её владельцев. Используйте на свой риск.'

</script>

<script>
/* ---------------- UI ---------------- */
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  };
  let lang = 'en';
  let loaded = null; // { name, buf, dec }

  function t(key) { const d = I18N[lang] || I18N.en; return (key in d) ? d[key] : I18N.en[key]; }
  function fill(s) {
    return String(s).replace('{npi}', NPI_URL).replace('{npiShort}', NPI_URL.replace('https://', ''))
      .replace('{repo}', REPO_URL).replace('{up}', NPI_UPSTREAM);
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // ----- selects -----
  function opt(sel, items, value) {
    sel.innerHTML = items.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
    if (value !== undefined && items.some(i => String(i[0]) === String(value))) sel.value = String(value);
  }
  function fillVendor(keep) {
    opt($('vendor'), ['nvidia', 'amd', 'intel', 'igpu'].map(v => [v, t('vendor_' + v)]), keep || $('vendor').value || 'nvidia');
  }
  function fillSeries(keep) {
    const v = $('vendor').value;
    opt($('series'), Core.SERIES[v].map(s => [s[0], s[1]]), keep);
  }
  function initStatic() {
    opt($('vram'), [2, 3, 4, 6, 8, 10, 11, 12, 16, 20, 24, 32].map(v => [v, v + ' GB']), 8);
    opt($('ram'), [8, 12, 16, 24, 32, 48, 64, 96, 128].map(v => [v, v + ' GB']), 16);
    opt($('threads'), [4, 6, 8, 10, 12, 14, 16, 20, 24, 28, 32].map(v => [v, String(v)]), 12);
    opt($('res'), [['1280x720', '1280 × 720'], ['1366x768', '1366 × 768'], ['1600x900', '1600 × 900'], ['1920x1080', '1920 × 1080 (Full HD)'], ['2560x1080', '2560 × 1080'], ['2560x1440', '2560 × 1440 (QHD)'], ['3440x1440', '3440 × 1440'], ['3840x2160', '3840 × 2160 (4K)']], '1920x1080');
    opt($('hz'), [60, 75, 100, 120, 144, 165, 170, 180, 240, 280, 360].map(v => [v, v + ' Hz']), 144);
  }

  function hw() {
    return {
      vendor: $('vendor').value, series: $('series').value,
      vram: +$('vram').value, ram: +$('ram').value, threads: +$('threads').value,
      res: $('res').value, hz: +$('hz').value
    };
  }
  function mode() { return document.querySelector('input[name=profile]:checked').value; }
  function potato() { return $('potato').checked; }

  // ----- render -----
  function render() {
    const h = hw();
    const { items, tier } = Core.profile(h, mode(), potato());
    $('tierName').textContent = t('tier' + tier.tier);
    $('tierReason').textContent = t('reason_' + tier.reason);

    // recommended table
    const rows = [];
    rows.push([t('rowDisplayMode'), t('valDisplayMode')]);
    rows.push([t('rowVsync'), 'Off']);
    rows.push([t('resolution'), h.res.replace('x', ' × ')]);
    for (const e of items) {
      let v = Core.valueName(e);
      if (e[0] === 'MaxFPS' && e[5] === 'noHz') v += ' (' + t('noHz') + ')';
      rows.push([e[1], v]);
    }
    rows.push([t('rowSRMode'), Core.upscaler(tier.kind)]);
    rows.push([t('rowFG'), 'Off']);
    rows.push([t('rowDof'), 'Off']);
    rows.push([t('rowFov'), mode() === 'Competitive' ? '105 – 120' : '90 – 105']);
    $('recTable').tBodies[0].innerHTML = rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('');

    // NVIDIA
    const isNv = h.vendor === 'nvidia';
    $('nvBlock').classList.toggle('hidden', !isNv);
    $('nvNo').classList.toggle('hidden', isNv);
    $('nvTable').tBodies[0].innerHTML = Core.NV_SETTINGS.map(s => `<tr><td>${esc(s[0])}</td><td>${esc(t(s[3]))}</td></tr>`).join('');

    if (loaded) processIni();
  }

  function renderTexts() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = fill(t(el.dataset.i)); });
    $('iniSteps').innerHTML = t('iniSteps').map(s => `<li>${fill(s)}</li>`).join('');
    $('afterSteps').innerHTML = t('afterSteps').map(s => `<li>${fill(s)}</li>`).join('');
    $('nvSteps').innerHTML = t('nvSteps').map(s => `<li>${fill(s)}</li>`).join('');
    $('tips').innerHTML = t('tips').map(s => `<li>${fill(s)}</li>`).join('');
    const vk = $('vendor').value, sk = $('series').value;
    fillVendor(vk); fillSeries(sk);
    render();
  }

  // ----- INI -----
  function processIni() {
    const st = $('fileStatus');
    const { items } = Core.profile(hw(), mode(), potato());
    const res = Core.applyIni(loaded.dec.text, items);
    if (!res.ok) {
      st.className = 'status err'; st.textContent = t('fileErr');
      $('iniResult').classList.add('hidden');
      loaded.out = null;
      return;
    }
    let msg = t('fileOk').replace('{n}', res.changes.length);
    if (!/^UserSystemSettingHD\.ini$/i.test(loaded.name)) msg += ' ' + t('fileName');
    st.className = 'status ok'; st.textContent = msg;
    const tagMap = { chg: ['chg', t('tagChg')], add: ['add', t('tagAdd')], same: ['same', t('tagSame')] };
    $('chgTable').tBodies[0].innerHTML = res.changes.map(c => {
      const before = c.old === null ? '—' : esc(c.old);
      const tg = tagMap[c.status];
      return `<tr><td>${esc(c.e[1])} <span class="tag ${tg[0]}">${esc(tg[1])}</span></td><td>${before}</td><td><code>${esc(c.key)}</code></td><td>${esc(String(c.e[2]))} · ${esc(Core.valueName(c.e))}</td></tr>`;
    }).join('');
    $('dlssNote').textContent = res.dlssSkipped ? t('dlssSkipped') : '';
    $('iniResult').classList.remove('hidden');
    loaded.out = Core.encode(res.text, loaded.dec.enc);
  }

  function readFile(f) {
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { loaded = { name: f.name, buf: r.result, dec: Core.decode(r.result) }; processIni(); };
    r.readAsArrayBuffer(f);
  }

  function download(name, data, type) {
    const blob = new Blob([data], { type: type || 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // ----- detection -----
  function measureHz() {
    return new Promise(resolve => {
      const ts = []; let n = 0;
      function f(t0) { ts.push(t0); if (++n < 70) requestAnimationFrame(f); else {
        const d = []; for (let i = 10; i < ts.length; i++) d.push(ts[i] - ts[i - 1]);
        d.sort((a, b) => a - b); const med = d[Math.floor(d.length / 2)];
        resolve(med > 0 ? 1000 / med : 0);
      } }
      requestAnimationFrame(f);
    });
  }
  function nearest(list, v) { return list.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a); }

  async function detect() {
    const found = [];
    const th = navigator.hardwareConcurrency;
    if (th) { $('threads').value = String(nearest([4, 6, 8, 10, 12, 14, 16, 20, 24, 28, 32], th)); found.push(th + ' threads'); }
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(screen.width * dpr), hgt = Math.round(screen.height * dpr);
    const resList = [...$('res').options].map(o => o.value);
    const exact = resList.find(r => r === w + 'x' + hgt);
    if (exact) { $('res').value = exact; found.push(w + '×' + hgt); }
    try {
      const gl = document.createElement('canvas').getContext('webgl');
      const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
      const ren = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '';
      const g = Core.parseRenderer(ren);
      if (g) {
        $('vendor').value = g.vendor; fillSeries(g.series);
        const m = ren.match(/(GeForce|Radeon|Arc|Intel)[^(),]*/i);
        found.push(m ? m[0].trim() : g.series);
      }
    } catch (e) { /* WebGL unavailable */ }
    const hz = await measureHz();
    if (hz > 30) { const n = nearest([60, 75, 100, 120, 144, 165, 170, 180, 240, 280, 360], hz); $('hz').value = String(n); found.push(n + ' Hz'); }
    $('detectMsg').textContent = found.length ? t('detectDone').replace('{items}', found.join(', ')) : t('detectNone');
    render();
  }

  // ----- init -----
  $('ver').textContent = 'v' + VERSION;
  $('lang').innerHTML = Object.keys(I18N).map(k => `<option value="${k}">${I18N[k]._name}</option>`).join('');
  const saved = store.get('dft_lang');
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  lang = (saved && I18N[saved]) ? saved : (I18N[nav] ? nav : 'en');
  $('lang').value = lang;
  initStatic();
  fillVendor('nvidia'); fillSeries('rtx30');
  renderTexts();

  $('lang').addEventListener('change', e => { lang = e.target.value; store.set('dft_lang', lang); renderTexts(); });
  $('vendor').addEventListener('change', () => { fillSeries(); render(); });
  ['series', 'vram', 'ram', 'threads', 'res', 'hz'].forEach(id => $(id).addEventListener('change', render));
  document.querySelectorAll('input[name=profile]').forEach(r => r.addEventListener('change', render));
  $('potato').addEventListener('change', render);
  $('detect').addEventListener('click', detect);
  $('file').addEventListener('change', e => readFile(e.target.files[0]));
  const drop = $('drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => readFile(e.dataTransfer.files[0]));
  $('dlIni').addEventListener('click', () => { if (loaded && loaded.out) download('UserSystemSettingHD.ini', loaded.out); });
  $('dlOrig').addEventListener('click', () => { if (loaded) download('UserSystemSettingHD.ini.backup', loaded.buf); });
  $('dlNip').addEventListener('click', () => download('DeltaForce_NVIDIA.nip', '﻿' + Core.buildNip(), 'application/xml'));
})();
</script>
</body>
